services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Declared here (not just via an ad hoc `--build-arg` on the CLI) so
        # scripts/setup.sh and a plain `docker compose build` re-run later
        # resolve to the exact same build-arg value and reliably hit the
        # cached pip-install layer — see the Week1 PoC's debug/issue-04.
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    image: lucent:latest
    container_name: lucent
    # Never auto-removed: `docker compose stop` (used by scripts/stop.sh)
    # keeps the container on disk with all its state; only an explicit
    # `docker compose down` deletes it.
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8750}:8000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:-lucent-dev-secret-change-in-production}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@lucent.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-qwen/qwen3-8b}
    volumes:
      # Persistent app data: SQLite DB, Chroma vector store, the seed
      # corpus (Federalist Papers + Korean Wikipedia), uploaded documents.
      # Survives container restarts/rebuilds.
      - lucent_data:/app/data
      # HuggingFace model cache — downloaded once, reused on every restart.
      - lucent_hf_cache:/app/hf_cache
      # Read-only reference to the repo-level API key files. Never baked
      # into the image; the app reads the file at call-time (see
      # backend/app/config.py's *_api_key_file settings).
      - ../../../../api_keys:/app/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 20

volumes:
  lucent_data:
  lucent_hf_cache:
